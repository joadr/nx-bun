name: CI

on:
  pull_request:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: npx nx run nx-bun:typecheck

      - name: Build plugin
        run: npx nx run nx-bun:build

      - name: Run plugin tests
        run: npx nx run nx-bun:test

      - name: Build example app
        run: npx nx run example-app:build --watch=false

      - name: Run JSX example tests
        run: npx nx run jsx-example-app:test
