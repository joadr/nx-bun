name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version for @joadr/nx-bun
        required: true
        type: string

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build package
        run: npx nx run nx-bun:build

      - name: Set publish name and version
        working-directory: packages/nx-bun
        run: npm pkg set name=@joadr/nx-bun version=${{ inputs.version }}

      - name: Publish to npm
        working-directory: packages/nx-bun
        run: npm publish --access public --provenance
